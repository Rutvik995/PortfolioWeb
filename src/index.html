<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutvik Bhanderi | AI Systems Developer</title>

    <meta name="description"
        content="Rutvik Bhanderi — AI systems developer building autonomous agents, multi-agent orchestrations, and deterministic compound AI systems in a 3D interactive workspace.">
    <meta name="keywords"
        content="Rutvik Bhanderi, AI Engineer, LangGraph, Multi-Agent Systems, Compound AI, Python, FastAPI, Machine Learning, Three.js">
    <meta name="author" content="Rutvik Bhanderi">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="fullscreen-room-mode">
    <a href="#hud-dock" class="skip-to-content">Skip to navigation dock</a>

    <!-- Top Fixed Glass Header -->
    <header class="site-header">
        <div class="header-inner">
            <button class="brand-badge" id="btn-brand-home" aria-label="Rutvik Bhanderi Portfolio Overview">
                <span class="brand-name">Rutvik</span>
                <span class="brand-slash">/</span>
                <span class="brand-role">AI Systems</span>
            </button>

            <div class="availability-status" title="Open to full-time AI/ML engineering roles">
                <span class="status-pulse"></span>
                <span class="status-text">Available for AI/ML Roles</span>
            </div>

            <nav class="nav-links" aria-label="Room zones navigation">
                <button class="nav-item active" data-zone="overview">Overview</button>
                <button class="nav-item" data-zone="projects">Projects</button>
                <button class="nav-item" data-zone="experience">Experience</button>
                <button class="nav-item" data-zone="skills">Skills</button>
                <button class="nav-item" data-zone="about">About</button>
                <button class="nav-item" data-zone="contact">Contact</button>
            </nav>

            <div class="header-actions">
                <a href="https://github.com/Rutvik995" target="_blank" rel="noopener noreferrer" class="btn-icon"
                    title="GitHub Profile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                    </svg>
                </a>
                <a href="https://linkedin.com/in/rutvikbhanderi" target="_blank" rel="noopener noreferrer"
                    class="btn-icon" title="LinkedIn Profile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.761-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                </a>
                <button class="btn-primary-header" id="btn-header-contact" data-zone="contact">Get in touch</button>
            </div>
        </div>
    </header>

    <!-- Fullscreen 3D Room Experience -->
    <main class="room-fullscreen" aria-label="Interactive 3D Room Experience">
        <!-- Fallback loading poster -->
        <div class="room-fallback-poster" aria-hidden="true">
            <div class="fallback-glow"></div>
            <div class="fallback-spinner"></div>
            <span class="fallback-text">Loading 3D Workspace...</span>
        </div>

        <!-- 3D WebGL Canvas Container -->
        <div class="experience"></div>

        <!-- Interactive Drag Hint -->
        <div class="room-hint">
            <span class="hint-dot"></span>
            <span class="hint-text">Drag room to orbit • Click 3D objects or dock to explore zones • Double-click for
                overview</span>
        </div>

        <!-- Sleek Floating Contextual Glass Card (Dismissible Modal) -->
        <aside id="context-card" class="context-card hidden" aria-label="Zone Details" aria-hidden="true">
            <div class="card-glass-header">
                <div class="card-badge-wrap">
                    <span class="zone-badge" id="card-zone-badge">SYSTEM / ZONE</span>
                    <span class="zone-status-dot"></span>
                </div>
                <h2 class="card-zone-title" id="card-zone-title">Zone Details</h2>
                <button class="btn-card-close" id="btn-card-close" title="Close details card (Esc)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="card-glass-body" id="card-glass-body">
                <!-- Dynamically rendered based on active zone -->
            </div>
        </aside>

        <!-- Toggle Button to Reopen Context Card when dismissed -->
        <button id="btn-reopen-card" class="btn-reopen-card hidden" title="Show zone information">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
            <span id="reopen-card-label">View Info</span>
        </button>

        <!-- Floating Bottom Dock & Music Player Container (Side-by-Side Flex Layout) -->
        <div class="bottom-bar-container">
            <!-- Floating Minimal HUD Dock -->
            <nav id="hud-dock" class="hud-dock" aria-label="Room Zones HUD Dock">
                <button class="dock-item active" data-zone="overview" title="Room Overview (Press 1)">
                    <span class="dock-icon">🏠</span>
                    <span class="dock-label">Overview</span>
                </button>
                <button class="dock-item" data-zone="projects" title="PC Monitor: Projects (Press 2)">
                    <span class="dock-icon">💻</span>
                    <span class="dock-label">Projects</span>
                </button>
                <button class="dock-item" data-zone="experience" title="MacBook: Experience (Press 3)">
                    <span class="dock-icon">⚡</span>
                    <span class="dock-label">Experience</span>
                </button>
                <button class="dock-item" data-zone="skills" title="Bookshelf: Skills (Press 4)">
                    <span class="dock-icon">📚</span>
                    <span class="dock-label">Skills</span>
                </button>
                <button class="dock-item" data-zone="about" title="Desk & Chair: About (Press 5)">
                    <span class="dock-icon">☕</span>
                    <span class="dock-label">About</span>
                </button>
                <button class="dock-item" data-zone="contact" title="Coffee Table: Contact (Press 6)">
                    <span class="dock-icon">📡</span>
                    <span class="dock-label">Contact</span>
                </button>
            </nav>

            <!-- TV Music Player Pill (Flex Sibling, Never Overlaps Dock) -->
            <div id="tv-music-player"></div>
        </div>
    </main>
</body>

</html>
