name: Daily GitHub Portfolio Sync

on:
  schedule:
    # Runs once every day at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync public GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Rutvik995
        run: node scripts/sync-github.mjs

      - name: Commit & push changes if any
        run: |
          if git diff --quiet src/data/githubProjects.json; then
            echo "No changes in public repositories."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/githubProjects.json
          git commit -m "chore(sync): update public GitHub repositories"
          git push origin HEAD:main
          git push origin HEAD:master
